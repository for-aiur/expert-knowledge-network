name = "expert-knowledge-network"
main = "src/worker/index.ts"
compatibility_date = "2025-02-14"
send_metrics = false
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "expert-knowledge-network"
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[env.production]
name = "expert-knowledge-network-beta"

[[env.production.d1_databases]]
binding = "DB"
database_name = "expert-knowledge-network-beta"
database_id = "c0f38e9c-8332-4240-a52c-02d89e215a7d"
migrations_dir = "migrations"
